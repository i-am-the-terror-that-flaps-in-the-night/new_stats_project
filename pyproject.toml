[project]
name = "stats-new"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "i-am-the-terror-that-flaps-in-the-night", email = "anirudh.gupta.sa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

# Installs the analysis package into .venv so `import analysis` works from any folder
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "analysis"
module-root = ""
namespace = true
